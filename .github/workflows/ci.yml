name: Java CI - Kiran Bank Enterprise

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build and Test Standalone Kiran Bank Enterprise
      working-directory: October/Day03_Task3
      run: |
        javac -d . BankingApp.java BankingAppTest.java
        java -cp . BankingAppTest
        rm -f *.class
