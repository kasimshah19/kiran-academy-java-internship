name: Java Backend CI

on:
  push:
    paths:
      - 'flight-booking-system/**'
  pull_request:
    paths:
      - 'flight-booking-system/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: flightbooking
          POSTGRES_USER: flightuser
          POSTGRES_PASSWORD: flightpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and Test with Maven
        working-directory: flight-booking-system
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/flightbooking
          SPRING_DATASOURCE_USERNAME: flightuser
          SPRING_DATASOURCE_PASSWORD: flightpass
          JWT_SECRET: 9a8b7c6d5e4f3a2b1c0d9e8f7a6b5c4d3e2f1a0b9c8d7e6f5a4b3c2d1e0f9a8b
        run: mvn clean verify
